[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracktal-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "supabase>=2.4.0",
    "alembic>=1.13.0",
    "anthropic>=0.26.0",
    "python-dotenv>=1.0.0",
    "sentry-sdk>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tracktal_api"]
